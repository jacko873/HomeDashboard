name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # stdlib only — no module cache to speak of
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  installer:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/install.sh
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./deploy
