# Cast the Now Playing dashboard to the TV when the Living Room Sonos
# starts playing.
#
# Adjust before use:
#   - media_player.living_room      -> your Sonos player entity
#   - media_player.living_room_tv   -> your Chromecast / TV entity
#   - the dashboard URL/IP and ?player= for your setup
#
# Uses DashCast (built into the HA Google Cast integration) to display an
# arbitrary web page. See README.md in this folder for caveats and
# alternatives for Android TV / LG webOS / Fully Kiosk.
alias: "Cast Now Playing dashboard when Living Room plays"
description: >-
  When the Living Room Sonos starts playing, show the music dashboard on the TV.
triggers:
  - trigger: state
    entity_id: media_player.living_room
    to: "playing"
    for: "00:00:03" # debounce track-change blips
conditions:
  # Only take over the TV when it isn't already showing something else.
  # Remove this block if the dashboard should always take over.
  - condition: state
    entity_id: media_player.living_room_tv
    state:
      - "off"
      - "idle"
      - "standby"
      - "unavailable"
actions:
  - action: media_player.play_media
    target:
      entity_id: media_player.living_room_tv
    data:
      media_content_type: cast
      media_content_id: >-
        {"app_name": "dashcast", "media_id": "http://10.0.0.4/music?player=living_room"}
mode: single